name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Préparer le corpus officiel
        run: |
          url="$(python -c 'import json; print(json.load(open("data/corpus.json", encoding="utf-8"))["sources"]["code"]["url"])')"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$url" --output "$RUNNER_TEMP/code-du-travail.pdf"
          python src/preparer_passages.py --code "$RUNNER_TEMP/code-du-travail.pdf"
      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v
      - name: Mesurer la recherche documentaire
        run: python src/recherche.py --evaluer
      - name: Construire les distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publier les distributions du workflow
        uses: actions/upload-artifact@v7
        with:
          name: distributions-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
